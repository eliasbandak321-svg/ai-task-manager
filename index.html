<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1018" media="(prefers-color-scheme: dark)" />
    <script>
      /* Apply the stored theme before first paint (see src/lib/theme.ts). */
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="AI Task Manager keeps your tasks, priorities and progress in one calm, focused workspace, so you always know what to do next."
    />
    <title>AI Task Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
