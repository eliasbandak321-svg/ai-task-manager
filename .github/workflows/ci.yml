# Continuous integration: the same checks we run locally before every commit,
# run automatically on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # same Node version as local development
          cache: npm

      # npm ci installs exactly what package-lock.json says (reproducible, fails if it's out of date).
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
